<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JP Signature Add-in</title>
  <style>
    body { font-family: "Public Sans", Aptos, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; color: #111; background: #fff; line-height: 1.5; }
    code { background: #f2f2f2; padding: 0 .25rem; }
  </style>
</head>
<body>
  <h1>JP Signature Add-in</h1>
  <p>This add-in runs in the background in Outlook. It has no screen of its own.</p>
  <ul>
    <li>New message: <strong>default</strong> signature</li>
    <li>Reply or forward: <strong>External</strong> signature</li>
    <li>Any recipient outside <code>@adem.alabama.gov</code>: switches to <strong>External</strong></li>
  </ul>
</body>
</html>
